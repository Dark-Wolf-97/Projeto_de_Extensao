name: portal-isg

x-backend-environment: &backend-environment
  DATABASE_URL: mysql://${DB_USER:?Defina DB_USER}:${DB_PASSWORD:?Defina DB_PASSWORD}@mysql:3306/${DB_NAME:-clinica_db}
  PORT: 3000
  JWT_SECRET: ${JWT_SECRET:?Defina JWT_SECRET}
  JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
  COOKIE_SECURE: "true"
  CORS_ORIGIN: ${CORS_ORIGIN:-}
  GOOGLE_CALENDAR_ENABLED: ${GOOGLE_CALENDAR_ENABLED:-false}
  GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
  GOOGLE_SERVICE_ACCOUNT_EMAIL: ${GOOGLE_SERVICE_ACCOUNT_EMAIL:-}
  GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY: ${GOOGLE_SERVICE_ACCOUNT_PRIVATE_KEY:-}
  GOOGLE_CALENDAR_TIMEZONE: ${GOOGLE_CALENDAR_TIMEZONE:-America/Sao_Paulo}
  GOOGLE_CALENDAR_DEFAULT_DURATION_MINUTES: ${GOOGLE_CALENDAR_DEFAULT_DURATION_MINUTES:-30}
  WHATSAPP_CONFIRMACAO_DELAY_MINUTES: ${WHATSAPP_CONFIRMACAO_DELAY_MINUTES:-3}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "5"

services:
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    command: --lower-case-table-names=1
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Defina DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_NAME:-clinica_db}
      MYSQL_USER: ${DB_USER:?Defina DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD:?Defina DB_PASSWORD}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - database
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 30s
    logging: *default-logging

  api:
    build:
      context: ./backend
      target: api
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      <<: *backend-environment
      PROCESS_ROLE: api
      WHATSAPP_ENABLED: "false"
      ADMIN_NOME: ${ADMIN_NOME:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SECRETARIA_NOME: ${SECRETARIA_NOME:-}
      SECRETARIA_EMAIL: ${SECRETARIA_EMAIL:-}
      SECRETARIA_PASSWORD: ${SECRETARIA_PASSWORD:-}
      SECRETARIA_TELEFONE: ${SECRETARIA_TELEFONE:-}
      MEDICO_NOME: ${MEDICO_NOME:-}
      MEDICO_EMAIL: ${MEDICO_EMAIL:-}
      MEDICO_PASSWORD: ${MEDICO_PASSWORD:-}
      MEDICO_CRM: ${MEDICO_CRM:-}
      MEDICO_ESPECIALIDADE: ${MEDICO_ESPECIALIDADE:-}
      MEDICO_TELEFONE: ${MEDICO_TELEFONE:-}
    expose:
      - "3000"
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    logging: *default-logging

  whatsapp-worker:
    build:
      context: ./backend
      target: whatsapp-worker
    restart: unless-stopped
    command: ["node", "dist/src/main"]
    depends_on:
      mysql:
        condition: service_healthy
      api:
        condition: service_healthy
    environment:
      <<: *backend-environment
      PROCESS_ROLE: whatsapp-worker
      WHATSAPP_ENABLED: ${WHATSAPP_ENABLED:-true}
      WHATSAPP_SESSION_PATH: /app/whatsapp-session
    volumes:
      - whatsapp_session:/app/whatsapp-session
    expose:
      - "3000"
    networks:
      - application
      - database
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s
    shm_size: 512mb
    stop_grace_period: 30s
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      whatsapp-worker:
        condition: service_healthy
    environment:
      TLS_HOSTNAME: ${TLS_HOSTNAME:-isg.clinica.local}
      TLS_IP_ADDRESS: ${TLS_IP_ADDRESS:-}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - tls_certs:/etc/nginx/certs
    networks:
      - application
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *default-logging

networks:
  application:
  database:
    internal: true

volumes:
  mysql_data:
  whatsapp_session:
  tls_certs:
